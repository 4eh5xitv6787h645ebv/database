# Deploys docs/ to GitHub Pages. Only the docs folder is uploaded, so the huge
# ops/*.sql files never touch the Pages pipeline (the legacy Jekyll builder
# errored on them).
name: Deploy audit report to Pages
on:
  push:
    branches: [fix/regex-audit]
    paths: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
