  - `sbs` (side-by-side).

  - `half ou` or `half sbs` with space (` `), dot (`.`), or hyphen (`-`) as separators.



  Regex orginal:

  (?<=\b[12]\d{3}\b).*\b((bluray|bd)?3d|sbs|half[ .-]ou|half[ .-]sbs)\b


