name: Dual Audio
pattern: (?i)(\bdual[ ._-]?(?:audio|complete)\b|[\[(]dual[\])]|\b2[ ._-]?audio\b|\bbilingual\b|\bmulti(?:[^a-zA-Z]|\b)|\b(?:JA|JP|JPN|JAP|ZH|CHN|CHI|KO|KOR|Japanese|Chinese|Korean)\b[ ._+&/\-]+\b(?:EN|ENG|English)\b|\b(?:EN|ENG|English)\b[ ._+&/\-]+\b(?:JA|JP|JPN|JAP|ZH|CHN|CHI|KO|KOR|Japanese|Chinese|Korean)\b|\b(?:JA|JP|JPN|JAP|ZH|CHN|CHI|KO|KOR)(?:EN|ENG)\b|\b(?:EN|ENG)(?:JA|JP|JPN|JAP|ZH|CHN|CHI|KO|KOR)\b|(?:\b(?:\d{3,4}[pi]|4K|8K|UHD|UltraHD)\b[^()\[\]]{0,40})\bDUAL\b(?![ ._-]?(?:layer|dl)\b)(?![ ._-]?\d{4}\b))
description: Matches releases with Dual Audio - releases containing BOTH original language
  (Japanese, Korean, Chinese) AND English audio. Supports MULTi, Dual Audio/Complete,
  2Audio, Bilingual, language code pairs with various separators (JPN.ENG, JA+EN,
  KOR/ENG, JPNENG), and DUAL after quality indicators. Excludes Dual Layer/DL discs,
  English-dub-only, and movie titles containing "Dual".
tags:
- Anime
- Audio
